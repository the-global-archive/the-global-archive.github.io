 if(c.thumb){const ar=c.ar||1;if(ar>=1.4){w=2;r=4}else if(ar>=.85){r=4}else r=5;return{cls:(w===2?"c2 ":"")+"r"+r,fs,fw,lc:2,r,w,pol:1,h}}

const layerHTML=()=>(S.menu?drawer():"")+(S.nopen?npanel():"")+(S.modal==="auth"?authModal():"")+(S.modal==="edit"?editModal():"");
function parseHash(){const h=location.hash.slice(1)||"/";const i=h.indexOf("?");const p=i<0?h:h.slice(0,i);return{parts:p.split("/").filter(Boolean),params:new URLSearchParams(i<0?"":h.slice(i+1))}}
function route(){
 const{parts,params}=parseHash(),r=parts[0],arg=parts[1]?decodeURIComponent(parts[1]):"";
 switch(r){case"explore":S.q=params.get("q")||"";return feed(true);case"countries":return countries();case"country":return country(arg);case"c":return detail(arg);
 case"u":return profile(arg);case"contribute":return contribute(params);case"saved":return saved();case"mine":return mine();
 case"admin":case"reports":return reports();case"calendar":return calendar();case"site":return site();case"settings":return settings();case"about":return about();
 default:S.q="";return feed(false)}
}
function render(keep){
 const y=window.scrollY;applyTheme();S.after=null;
 let body;
 if(!S.loaded)body=S.loadErr?`<div class="box"><p class="err">couldn't load the archive. check that the firebase config and firestore rules are set up.</p></div>`:`<p class="k" style="margin-top:20px">loading…</p>`;
 else body=route();
 $("#app").innerHTML=top()+`<main>${body}</main>`;
 $("#layer").innerHTML=layerHTML();
 window.scrollTo(0,keep?y:0);
 if(S.after)S.after();
}

  await Promise.all([...a.docs.filter(d=>d.data().authorName!==name||d.data().authorHandle!==handle).map(d=>updateDoc(doc(db,"contributions",d.id),{authorName:name,authorHandle:handle})),
   ...b.docs.filter(d=>d.data().name!==name||d.data().handle!==handle).map(d=>updateDoc(doc(db,"comments",d.id),{name,handle}))]);

document.addEventListener("click",async e=>{
 const t=e.target;

 if(t.closest("[data-close]")){S.menu=false;render(true)}

  case"closemodal":S.modal=null;render(true);break;
  case"login":S.menu=false;S.modal="auth";S.authMode="login";render(true);break;

  case"google":try{await signInWithPopup(auth,new GoogleAuthProvider());S.modal=null}catch(err){authErr(err)}break;
  case"reset":{const em=$("#ae")?$("#ae").value.trim():"";if(!em){$("#aerr").textContent="enter your email first.";break}
   try{await sendPasswordResetEmail(auth,em);$("#aerr").textContent="password reset email sent."}catch(err){authErr(err)}break}
  case"logout":await signOut(auth);S.menu=false;toast("logged out");break;
  case"theme":themePick=d.t;try{localStorage.setItem("ga_theme",themePick)}catch{}applyTheme();render(true);
   if(S.user&&S.profile&&S.profile.username)setDoc(doc(db,"users",S.user.uid),{theme:themePick},{merge:true}).then(()=>{S.profile.theme=themePick}).catch(()=>{});break;
  case"sort":S.sort=d.t;S.show=40;render(true);break;
  case"more":S.show+=40;render(true);break;
  case"clearq":location.hash="#/";break;
  case"random":S.menu=false;if(S.items.length){location.hash="#/c/"+S.items[Math.floor(Math.random()*S.items.length)].id}else toast("nothing to show yet");break;
  case"like":{if(!need())break;const id=d.id,ref=doc(db,"likes",id+"_"+S.user.uid);
   if(S.myLikes.has(id)){await deleteDoc(ref);S.likes=S.likes.filter(l=>!(l.cid===id&&l.uid===S.user.uid))}
   else{await setDoc(ref,{cid:id,uid:S.user.uid});S.likes.push({cid:id,uid:S.user.uid});const c=S.items.find(x=>x.id===id);if(c)notify(c.authorUid,"like",{cid:id,id:"like_"+id+"_"+S.user.uid})}
   rebuildLikes();render(true);break}
  case"save":{if(!need())break;const id=d.id,ref=doc(db,"saves",id+"_"+S.user.uid);
   if(S.saves.has(id)){await deleteDoc(ref);S.saves.delete(id)}else{await setDoc(ref,{cid:id,uid:S.user.uid});S.saves.add(id)}
   render(true);break}
  case"follow":{if(!need())break;const u=d.uid;if(u===S.user.uid)break;const ref=doc(db,"follows",S.user.uid+"_"+u);
   if(S.following.has(u)){await deleteDoc(ref);S.following.delete(u);if(S.pf&&S.pf.uid===u)S.pf.followers.delete(S.user.uid)}
   else{await setDoc(ref,{follower:S.user.uid,following:u});S.following.add(u);if(S.pf&&S.pf.uid===u)S.pf.followers.add(S.user.uid);notify(u,"follow",{id:"follow_"+S.user.uid+"_"+u})}

  case"heart":{if(!need())break;const u=d.uid;if(u===S.user.uid||!S.pf)break;const ref=doc(db,"hearts",S.user.uid+"_"+u);
   if(S.pf.hearts.has(S.user.uid)){await deleteDoc(ref);S.pf.hearts.delete(S.user.uid)}

  case"delcm":if(confirm("delete this comment?")){await deleteDoc(doc(db,"comments",d.id));loadComments(d.cid)}break;

   if(d.kind==="comment")await deleteDoc(doc(db,"comments",d.ref));else await delPost(S.items.find(x=>x.id===d.ref)||{id:d.ref});

  case"unban":await deleteDoc(doc(db,"bans",d.uid));afterBan(d.uid,false);toast("unbanned");break;

   const[p,c]=await Promise.all([getDocs(query(collection(db,"contributions"),where("authorUid","==",d.uid),limit(500))),getDocs(query(collection(db,"comments"),where("uid","==",d.uid),limit(500)))]);
   await Promise.all([...p.docs.map(x=>delPost({id:x.id,...x.data()})),...c.docs.map(x=>deleteDoc(doc(db,"comments",x.id)))]);
   await loadPublic();render(true);toast("deleted "+p.docs.length+" posts and "+c.docs.length+" comments")}break;
  /* calendar */

function authErr(err){
 const m={"auth/invalid-credential":"wrong email or password.","auth/user-not-found":"no account with that email.","auth/wrong-password":"wrong email or password.","auth/email-already-in-use":"that email already has an account. try logging in.","auth/weak-password":"password must be at least 6 characters.","auth/invalid-email":"that email doesn't look right.","auth/popup-closed-by-user":"","auth/cancelled-popup-request":"","auth/too-many-requests":"too many attempts. wait a moment and try again.","auth/unauthorized-domain":"this site's domain isn't authorised in firebase yet."};
 const el=$("#aerr");if(el)el.textContent=err&&err.code in m?m[err.code]:"something went wrong. please try again.";
}
document.addEventListener("input",e=>{

 if(id==="tq"){S.q=e.target.value;if(parseHash().parts[0]==="explore"&&$("#results"))$("#results").innerHTML=resultsHTML(true)}

   const old=S.profile&&S.profile.username,p={...S.profile,name,username:un,bio:$("#pb").value.trim().slice(0,300),home:$("#ph2").value};
   if(S.files.avatar)p.photo=S.files.avatar;else if(S.files.rmav)delete p.photo;
   try{const b=writeBatch(db);if(un!==old){b.set(doc(db,"usernames",un),{uid:S.user.uid});if(old)b.delete(doc(db,"usernames",old))}
    b.set(doc(db,"users",S.user.uid),p);await b.commit()}
   catch(x){console.error(x);err.textContent="couldn't save. that username may already be taken.";break}
   S.profile=p;S.modal=null;S.pf=null;toast("profile saved");render(true);
   await propagateNames(S.user.uid,name,un);await loadPublic();if(!S.modal)render(true);break}
  case"cf":{if(!need())break;await submitPost();break}
 }}catch(err){console.error(err);toast("that didn't work, please try again")}
});
async function submitPost(){
 const T=S.pt,F=FM[T],err=$("#ferr"),btn=$("#fsub");err.textContent="";
 if(!F){err.textContent="choose what you're sharing.";return}
 const country=$("#fc").value,title=$("#ft").value.trim(),text=$("#fx").value.trim(),caption=$("#fcap").value.trim(),link=F.link?$("#fl").value.trim():"",ing=F.ing?$("#fing").value.trim():"",css=F.css?$("#fcss").value.trim():"";
 const imgs=F.img?S.files.imgs:[],aud=F.aud?S.files.audio:null;
 if(!country){err.textContent="choose a country.";return}
 if(F.tr&&!title){err.textContent="add a "+F.t+".";return}
 if(F.ing&&!ing){err.textContent="add the ingredients.";return}
 if(F.xr&&!text){err.textContent="add your "+F.x+".";return}
 if(F.imgr&&!imgs.length){err.textContent="add at least one photo.";return}
 if(F.lr&&!link){err.textContent="add a link.";return}
 if(link&&!safeUrl(link)){err.textContent="that link needs to start with http:// or https://";return}
 if(T==="song"&&!aud&&!link){err.textContent="upload an mp3 or paste a link to the song.";return}
 if(!caption){err.textContent="write a caption. add #tags so people can find it.";return}
 const auto=S.admin||S.cfg.requireReview===false,cid=doc(collection(db,"contributions")).id;
 const data={country,type:T,caption:caption.slice(0,300),authorUid:S.user.uid,authorName:myName().slice(0,60),status:auto?"approved":"pending",createdAt:serverTimestamp()};
 if(myHandle())data.authorHandle=myHandle().slice(0,30);
 if(F.t&&title)data.title=title.slice(0,120);
 if(ing)data.ing=ing;if(text)data.text=text.slice(0,12000);if(link)data.link=link;if(css)data.css=css;
 if(imgs.length){data.imgs=imgs.length;data.thumb=imgs[0].thumb;data.ar=+(imgs[0].w/imgs[0].h).toFixed(3)}
 const jobs=[];
 imgs.forEach((x,i)=>jobs.push(setDoc(doc(db,"media",cid+"_i"+i),{cid,kind:"img",i,data:x.full,owner:S.user.uid})));
 if(aud){const parts=[];for(let p=0;p<aud.b64.length;p+=900000)parts.push(aud.b64.slice(p,p+900000));
  data.audio={name:aud.name,size:aud.size,parts:parts.length};
  parts.forEach((x,i)=>jobs.push(setDoc(doc(db,"media",cid+"_a"+i),{cid,kind:"aud",i,data:x,owner:S.user.uid})))}
 btn.disabled=true;btn.textContent=jobs.length?"uploading…":"posting…";
 try{await Promise.all(jobs);await setDoc(doc(db,"contributions",cid),data)}
 catch(x){console.error(x);err.textContent="couldn't submit. check everything is filled in and try again.";btn.disabled=false;btn.textContent=S.admin?"post":"submit for review";
  imgs.forEach((_,i)=>deleteDoc(doc(db,"media",cid+"_i"+i)).catch(()=>{}));return}
 S.files.imgs=[];S.files.audio=null;
 if(!auto)notify(ADMIN_UID,"pending",{cid});
 if(auto)await loadPublic();
 $("main").innerHTML=`<div class="notice">${auto?"your post is live!":"thank you! your post was submitted and will appear once it's been reviewed."}</div><div class="row">${auto?`<a class="btn p" href="#/c/${esc(cid)}">view post</a>`:""}<button class="btn" data-act="again">post another</button><a class="btn" href="#/mine">my posts</a></div>`;
}
window.addEventListener("hashchange",()=>{if(S.nopen)closeBell();S.menu=false;S.modal=null;S.pf=null;S.show=40;S.styled=false;render(false)});
onAuthStateChanged(auth,async u=>{
 S.user=u;S.profile=null;S.admin=!!u&&u.uid===ADMIN_UID;S.banned=false;S.saves=new Set();S.following=new Set();S.pf=null;S.pend={};S.cal.facts=null;S.nopen=false;
 listenNotifs(u);
 if(u){const[,bn]=await Promise.all([Promise.all([ensureProfile(u),loadMyStuff(u)]),loadBan(u)]);S.banned=bn}
 rebuildLikes();S.authReady=true;render(true);
});
render(false);
loadPublic().then(()=>render(true));
</script>
