<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the global archive</title>
<meta name="description" content="A shared archive of recipes, songs, writing and notes from every country, added by the people who know them.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f4;--card:#fff;--ink:#3b2a2f;--acc:#e0476b;--on:#fff;--gs:75%;--gl1:91%;--gl2:81%;--cink:rgba(50,30,40,.78)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:15px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
 --muted:color-mix(in srgb,var(--ink) 58%,var(--bg));--line:color-mix(in srgb,var(--ink) 12%,var(--bg));--soft:color-mix(in srgb,var(--ink) 7%,var(--bg))}
a{color:inherit}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.8rem)}h2{font-size:1.4rem}h3{font-size:.95rem;font-weight:600;margin:0;line-height:1.3}
h1 em,h2 em{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(12px,2.5vw,32px) calc(70px + env(safe-area-inset-bottom,0px))}
.k{font-size:.8rem;color:var(--muted)}.k a{text-decoration:none}.k a:hover{text-decoration:underline}
.sub{color:var(--muted);max-width:56ch;margin:10px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.gr{background:linear-gradient(150deg,hsl(var(--h) var(--gs) var(--gl1)),hsl(var(--h2) var(--gs) var(--gl2)))}
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
.logo{font:600 1.15rem 'Fraunces',Georgia,serif;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on);font-size:.9rem}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:0 16px;max-width:640px;margin:0 auto}
.srch input{background:none;border:0;padding:11px 0;width:100%;outline:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.btn{border:0;background:var(--soft);border-radius:999px;padding:9px 18px;font-weight:600;font-size:.88rem;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--ink) 13%,var(--bg))}
.btn.p{background:var(--acc);color:var(--on)}.btn.p:hover{filter:brightness(.93)}
.btn.on{background:var(--ink);color:var(--bg)}.btn.d{color:#d6455d}.btn.s{padding:6px 13px;font-size:.8rem}
.burger,.avb{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;flex:none}
.avb{color:var(--cink);font-weight:600}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;width:28px;height:28px;color:var(--cink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin-top:12px;align-items:center;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:none}
.tag{font-size:.74rem;font-weight:600;background:var(--soft);border-radius:99px;padding:3px 11px;white-space:nowrap}
.pill{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.pill.pend{background:#fbe9c4;color:#8a6410}.pill.ok{background:#d8efdf;color:#276b3c}
.intro{padding:18px 0 4px;max-width:720px}.intro h1{margin-bottom:6px}
.mas{column-width:225px;column-gap:18px;margin-top:14px}
.pin{display:block;break-inside:avoid;margin-bottom:22px;text-decoration:none}
.pc{position:relative}
.cover{border-radius:20px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:transform .2s,box-shadow .2s;overflow:hidden}
.pin:hover .cover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.14)}
.cg{font-size:2.3rem;line-height:1}
.cq{font:italic 500 1.08rem/1.35 'Fraunces',Georgia,serif;color:var(--cink);overflow:hidden;word-wrap:break-word}
.ptag{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);border-radius:99px;padding:3px 11px;font-size:.74rem;font-weight:600}
.plk{position:absolute;right:10px;top:10px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);border-radius:99px;padding:3px 10px;font-size:.74rem;font-weight:600}
.pin h3{margin:9px 4px 5px}.pm{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:.8rem;color:var(--muted)}.pm .av{width:22px;height:22px;font-size:.62rem}
.box{background:var(--card);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.box p{max-width:78ch}.fm{max-width:640px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tile{background:var(--card);border-radius:16px;padding:10px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile b{display:block;font:500 1.4rem 'Fraunces',Georgia,serif}.tile span{font-size:.76rem;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}.f label{font-weight:600;font-size:.85rem}
input,textarea,select{border:2px solid transparent;border-radius:16px;padding:11px 14px;background:var(--soft);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);background:var(--card)}
textarea{min-height:110px;resize:vertical}textarea.big{min-height:220px}
.err{color:#d6455d;min-height:1.3em;font-size:.88rem}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.notice{background:var(--card);border-radius:18px;padding:16px 20px;margin:14px 0;border:2px solid var(--acc)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.ctile{border-radius:20px;padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--cink);transition:transform .2s}
.ctile:hover{transform:translateY(-3px)}.ctile.zero{opacity:.6}.ctile .k{color:var(--cink);opacity:.8}
.cn2{font:500 1.3rem/1.15 'Fraunces',Georgia,serif}
.cban{border-radius:28px;padding:clamp(18px,4vw,36px);margin-top:10px;color:var(--cink)}.cban .k{color:var(--cink)}.cban h1{margin:10px 0}
.cban .tag{background:color-mix(in srgb,var(--card) 70%,transparent)}
.pinbig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--card);border-radius:30px;overflow:hidden;margin-top:12px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.pl{padding:14px}.pl .cover{min-height:380px;height:100%;max-height:640px;padding:26px}.pl .cg{font-size:3.4rem}.pl .cq{font-size:1.4rem}
.pr{padding:clamp(18px,3vw,34px)}.pr h1{font-size:clamp(1.6rem,3.4vw,2.3rem);margin:14px 0 8px}
@media(max-width:820px){.pinbig{grid-template-columns:1fr}.pl .cover{min-height:240px}}
.body{white-space:pre-wrap;word-wrap:break-word;margin:16px 0;font-size:1.02rem}
.emb{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;margin-top:12px;background:var(--soft)}.emb.spo{aspect-ratio:auto;height:152px}
.cm{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}.cm:first-child{border-top:0;padding-top:0}
.cm .body{margin:2px 0 0;font-size:.95rem}.grow{flex:1;min-width:0}
.phead{text-align:center;padding:20px 0 6px}.phead .av{width:88px;height:88px;font-size:2rem;margin:0 auto 12px}.phead .tiles{justify-content:center}
.scrim{position:fixed;inset:0;background:rgba(20,10,20,.35);z-index:7}
.drawer{position:fixed;top:0;right:0;bottom:0;height:100dvh;width:min(320px,90vw);background:var(--card);z-index:8;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:auto;border-radius:28px 0 0 28px;box-shadow:-12px 0 40px rgba(0,0,0,.15)}
.dhead{padding:6px 8px 12px}.dsec{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 10px 4px}
.dl{display:block;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:500}.dl:hover{background:var(--soft)}
.dout{margin-top:auto;width:100%;text-align:center}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px 10px}
.swb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}.swb.on{outline:2px solid var(--acc);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(20,10,20,.5);display:grid;place-items:start center;padding:16px;overflow:auto;z-index:9}
.sheet{background:var(--card);border-radius:28px;padding:26px;width:100%;max-width:400px;margin:6vh 0}
.div{text-align:center;margin:16px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:.88rem;z-index:20}
@media(max-width:640px){.logo span{display:none}.hide-m{display:none}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<noscript>This site needs JavaScript.</noscript>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,addDoc,setDoc,getDoc,getDocs,deleteDoc,updateDoc,doc,query,where,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDd5DmV6E8J1jhd0DKhbqMKcb8mD5ANEmg",
  authDomain: "the-global-archive.firebaseapp.com",
  projectId: "the-global-archive",
  storageBucket: "the-global-archive.firebasestorage.app",
  messagingSenderId: "496015789383",
  appId: "1:496015789383:web:d2039d67fb9df55be0d062",
  measurementId: "G-W9QJWR0MB3"
};
const COUNTRIES = [
  "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria",
  "Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia",
  "Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia",
  "Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo (Republic)",
  "Congo (Democratic Republic)","Costa Rica","Côte d'Ivoire","Croatia","Cuba","Cyprus","Czechia","Denmark","Djibouti",
  "Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini",
  "Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala",
  "Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland",
  "Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan","Laos",
  "Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi",
  "Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova",
  "Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands",
  "New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau",
  "Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia",
  "Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino",
  "São Tomé and Príncipe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia",
  "Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan",
  "Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga",
  "Trinidad and Tobago","Tunisia","Türkiye","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates",
  "United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen",
  "Zambia","Zimbabwe"
];

const TYPES={recipe:"recipe",song:"song rec",writing:"writing",note:"note",other:"other"};
const GLY={recipe:"🍲",song:"🎵",writing:"✍️",note:"📝",other:"✨"};
const LT=["75%","91%","81%","rgba(50,30,40,.78)"];
const THEMES={
 Blush:["#fff6f4","#ffffff","#3b2a2f","#e0476b",...LT],Sage:["#f3f6f1","#ffffff","#26332b","#5d8a6b",...LT],
 Lilac:["#f6f3fb","#ffffff","#2d2742","#8a6bd6",...LT],Sky:["#f1f7fc","#ffffff","#1f3447","#3b82c4",...LT],
 Sand:["#faf5ec","#ffffff","#3d3223","#c9792b",...LT],Midnight:["#14121a","#1f1c29","#f0ecf7","#ff7a9c","45%","30%","20%","rgba(255,255,255,.88)"]};

const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),db=getFirestore(fbApp);
const S={user:null,profile:null,admin:false,authReady:false,items:[],likes:[],likeMap:{},myLikes:new Set(),saves:new Set(),loaded:false,loadErr:false,
 q:"",type:"",ctype:"",sort:"new",cq:"",menu:false,modal:null,authMode:"login",pendingName:null,after:null};
let themePick="auto";
try{themePick=localStorage.getItem("ga_theme")||"auto"}catch{}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
const safeUrl=u=>{try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:null}catch{return null}};
const dt=ts=>{const d=ts&&ts.toDate?ts.toDate():null;return d?d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):""};
const ini=n=>(String(n||"?").trim()[0]||"?").toUpperCase();
const hh=s=>{let h=0;for(const ch of String(s||""))h=(h*31+ch.charCodeAt(0))%360;return h};
const hs=s=>{const h=hh(s);return `--h:${h};--h2:${(h+45)%360}`};
const clip=(t,n)=>{t=String(t||"").replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n).trim()+"…":t};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)};
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>(v/=255)<=.03928?v/12.92:((v+.055)/1.055)**2.4;return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const autoName=()=>{const h=new Date().getHours();return h>=21||h<6?"Midnight":"Blush"};
function applyTheme(){const t=THEMES[themePick==="auto"?autoName():themePick]||THEMES.Blush,r=document.documentElement.style;
 r.setProperty("--bg",t[0]);r.setProperty("--card",t[1]);r.setProperty("--ink",t[2]);r.setProperty("--acc",t[3]);
 r.setProperty("--gs",t[4]);r.setProperty("--gl1",t[5]);r.setProperty("--gl2",t[6]);r.setProperty("--cink",t[7]);
 r.setProperty("--on",lum(t[3])>.45?"#111":"#fff")}
applyTheme();setInterval(()=>{if(themePick==="auto")applyTheme()},60000);

/* ---------- data ---------- */
function rebuildLikes(){S.likeMap={};S.myLikes=new Set();
 for(const l of S.likes){S.likeMap[l.cid]=(S.likeMap[l.cid]||0)+1;if(S.user&&l.uid===S.user.uid)S.myLikes.add(l.cid)}}
async function loadPublic(){
 try{
  const[a,b]=await Promise.all([
   getDocs(query(collection(db,"contributions"),where("status","==","approved"),limit(1000))),
   getDocs(query(collection(db,"likes"),limit(5000)))]);
  S.items=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  S.likes=b.docs.map(d=>d.data());rebuildLikes();S.loaded=true;S.loadErr=false;return true;
 }catch(e){console.error(e);S.loadErr=true;return false}
}
async function ensureProfile(u){
 try{
  const r=doc(db,"users",u.uid),s=await getDoc(r);
  if(s.exists()){S.profile=s.data();return}
  const name=(S.pendingName||u.displayName||(u.email||"").split("@")[0]||"anonymous").slice(0,40);
  S.pendingName=null;const p={name,bio:"",home:""};await setDoc(r,p);S.profile=p;
 }catch(e){console.error(e);S.profile={name:u.displayName||"anonymous",bio:"",home:""}}
}
async function checkAdmin(u){try{return(await getDoc(doc(db,"admins",u.uid))).exists()}catch{return false}}
async function loadSaves(u){try{const s=await getDocs(query(collection(db,"saves"),where("uid","==",u.uid)));S.saves=new Set(s.docs.map(d=>d.data().cid))}catch(e){console.error(e)}}
const myName=()=>(S.profile&&S.profile.name)||(S.user&&S.user.displayName)||"anonymous";
function need(){if(S.user)return true;S.modal="auth";S.authMode="login";render(true);return false}

/* ---------- pieces ---------- */
const hay=c=>[c.title,c.body,c.country,c.artist,c.authorName,TYPES[c.type]].join(" ").toLowerCase();
function cover(c,full){
 const ht=[150,190,230,270][hh(c.id)%4];
 const txt=(c.type==="writing"||c.type==="note")?clip(c.body,full?700:110):(c.type==="song"&&c.artist?c.artist:"");
 return `<div class="cover gr" style="${hs(c.country)};${full?"":"min-height:"+ht+"px"}"><span class="cg">${GLY[c.type]||"✨"}</span>${txt?`<span class="cq">${esc(txt)}</span>`:""}</div>`;
}
function card(c){
 return `<a class="pin" href="#/c/${esc(c.id)}"><div class="pc">${cover(c,false)}<span class="ptag">${esc(c.country)}</span><span class="plk">♥ ${S.likeMap[c.id]||0}</span></div>
 <h3>${esc(c.title)}</h3><div class="pm"><span class="av gr" style="${hs(c.authorName)}">${esc(ini(c.authorName))}</span><span>${esc(c.authorName||"anonymous")}</span><span class="sp">${esc(TYPES[c.type]||c.type)}</span></div></a>`;
}
const grid=L=>L.length?`<div class="mas">${L.map(card).join("")}</div>`:`<p class="empty">nothing here yet.</p>`;
function chipsFor(active,act){
 return `<button class="btn s ${active===""?"on":""}" data-act="${act}" data-t="">all</button>`+Object.entries(TYPES).map(([k,v])=>`<button class="btn s ${active===k?"on":""}" data-act="${act}" data-t="${k}">${GLY[k]} ${v}</button>`).join("");
}
function embed(url){
 let m=url.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,15})/);
 if(m)return `<iframe class="emb" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy" title="video"></iframe>`;
 m=url.match(/open\.spotify\.com\/(track|album|playlist|episode)\/(\w{10,30})/);
 if(m)return `<iframe class="emb spo" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" allow="encrypted-media" loading="lazy" title="spotify"></iframe>`;
 return "";
}
const loginPrompt=w=>`<div class="box"><p>log in to see ${w}.</p><button class="btn p" data-act="login">log in or sign up</button></div>`;
function tiles(arr){return `<div class="tiles">${arr.map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("")}</div>`}

/* ---------- views ---------- */
function top(){
 const burger=`<button class="burger" data-act="menu" aria-label="menu"><svg class="ico" viewBox="0 0 24 24" style="color:var(--ink)"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>`;
 return `<header class="top"><a class="logo" href="#/"><i>◍</i><span>the global archive</span></a>
 <form id="topSearch" class="srch"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" placeholder="search recipes, songs, countries…" aria-label="search" value="${esc(S.q)}" autocomplete="off"></form>

function feed(useQ){

  <div class="row" style="margin-top:14px"><a class="btn p" href="#/contribute">+ add yours</a><button class="btn" data-act="random">surprise me</button><a class="btn" href="#/countries">browse countries</a></div>
  <p class="k" style="margin-top:14px">${S.items.length} contributions · ${cs.size} of ${COUNTRIES.length} countries · ${au.size} contributors</p></section>`;

async function loadReview(){

  <h3 style="margin-top:10px;font-size:1.05rem">${esc(c.title)}</h3>${c.artist?`<div class="k">${esc(c.artist)}</div>`:""}<div class="body">${esc(c.body)}</div>${l?`<p class="k">${esc(l)}</p>`:""}
  <div class="row"><button class="btn s p" data-act="approve" data-id="${esc(c.id)}">approve</button><button class="btn s d" data-act="reject" data-id="${esc(c.id)}">reject &amp; delete</button></div></div>`}).join(""):`<p class="empty">nothing waiting.</p>`)
  +`<h2 style="margin-top:26px">reports (${R.length})</h2>`+(R.length?R.map(x=>`<div class="box"><div class="row"><span class="pill">${esc(x.kind)}</span><a class="k" href="#/c/${esc(x.cid)}">view →</a></div>
  <div class="row" style="margin-top:12px"><button class="btn s" data-act="dismiss" data-id="${esc(x.id)}">dismiss</button><button class="btn s d" data-act="rm" data-id="${esc(x.id)}" data-kind="${esc(x.kind)}" data-ref="${esc(x.ref)}">remove content</button></div></div>`).join(""):`<p class="empty">no reports.</p>`);
 }catch(e){console.error(e);const el=$("#rv");if(el)el.innerHTML=`<p class="err">couldn't load the queue.</p>`}

function drawer(){
 const a=(h,t)=>`<a class="dl" href="${h}" data-close>${t}</a>`;
 return `<div class="scrim" data-act="close"></div><aside class="drawer"><div class="dhead"><span class="logo"><i>◍</i>the global archive</span></div>

 <div class="dsec">you</div>${a("#/contribute","create")}${S.user?a("#/saved","saved")+a("#/mine","my contributions")+a("#/u/"+esc(S.user.uid),"profile")+a("#/settings","settings"):""}${S.admin?a("#/review","review queue"):""}
 <div class="dsec">colours</div><div class="sws"><button class="swb ${themePick==="auto"?"on":""}" data-act="theme" data-t="auto" title="auto" aria-label="auto theme" style="background:linear-gradient(135deg,#fff6f4 50%,#14121a 50%)"></button>
 ${Object.keys(THEMES).map(n=>`<button class="swb ${themePick===n?"on":""}" data-act="theme" data-t="${n}" title="${n.toLowerCase()}" aria-label="${n.toLowerCase()} theme" style="background:linear-gradient(135deg,${THEMES[n][0]} 50%,${THEMES[n][3]} 50%)"></button>`).join("")}</div>
 ${S.user?`<button class="btn dout" data-act="logout">log out</button>`:`<button class="btn p dout" data-act="login">log in / sign up</button>`}</aside>`;

function authModal(){
 const su=S.authMode==="signup";
 return `<div class="modal"><div class="sheet"><div class="row"><h2 style="font-size:1.5rem">${su?"create an account":"welcome back"}</h2><button class="btn s sp" data-act="closemodal" aria-label="close">✕</button></div>
 <button class="btn" style="width:100%;margin-top:18px;padding:12px" data-act="google">continue with google</button><div class="div k">or use email</div>
 <form id="af">${su?`<div class="f"><label for="an">display name</label><input id="an" maxlength="40" required autocomplete="nickname"></div>`:""}
 <div class="f"><label for="ae">email</label><input id="ae" type="email" required autocomplete="email"></div>
 <div class="f"><label for="ap">password</label><input id="ap" type="password" minlength="6" required autocomplete="${su?"new-password":"current-password"}"></div>
 <div class="err" id="aerr"></div><button class="btn p" style="width:100%;padding:12px">${su?"sign up":"log in"}</button></form>
 <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn s" data-act="amode">${su?"have an account? log in":"new here? sign up"}</button><button class="btn s" data-act="reset">forgot password?</button></div></div></div>`;

function parseHash(){const h=location.hash.slice(1)||"/";const i=h.indexOf("?");const p=i<0?h:h.slice(0,i);return{parts:p.split("/").filter(Boolean),params:new URLSearchParams(i<0?"":h.slice(i+1))}}
function route(){
 const{parts,params}=parseHash(),r=parts[0],arg=parts[1]?decodeURIComponent(parts[1]):"";
 switch(r){case"explore":return feed(true);case"countries":return countries();case"country":return country(arg);case"c":return detail(arg);
 case"u":return profile(arg);case"contribute":return contribute(params);case"saved":return saved();case"mine":return mine();
 case"review":return review();case"settings":return settings();default:S.q="";return feed(false)}
}
function render(keep){
 const y=window.scrollY;applyTheme();S.after=null;
 let body;
 if(!S.loaded)body=S.loadErr?`<div class="box"><p class="err">couldn't load the archive. check that the Firebase config and Firestore rules are set up.</p></div>`:`<p class="k" style="margin-top:20px">loading…</p>`;
 else body=route();
 $("#app").innerHTML=top()+`<main>${body}</main>`;
 $("#layer").innerHTML=(S.menu?drawer():"")+(S.modal==="auth"?authModal():"");
 window.scrollTo(0,keep?y:0);
 if(S.after)S.after();
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
 const t=e.target;
 if(t.classList&&t.classList.contains("modal")){S.modal=null;render(true);return}
 if(t.closest("[data-close]")){S.menu=false;render(true)}
 const b=t.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,d=b.dataset;
 try{switch(a){
  case"menu":S.menu=!S.menu;render(true);break;
  case"close":S.menu=false;render(true);break;
  case"closemodal":S.modal=null;render(true);break;
  case"login":S.menu=false;S.modal="auth";S.authMode="login";render(true);break;
  case"amode":S.authMode=S.authMode==="login"?"signup":"login";render(true);break;
  case"google":try{await signInWithPopup(auth,new GoogleAuthProvider());S.modal=null}catch(err){authErr(err)}break;
  case"reset":{const em=$("#ae")?$("#ae").value.trim():"";if(!em){$("#aerr").textContent="enter your email first.";break}
   try{await sendPasswordResetEmail(auth,em);$("#aerr").textContent="password reset email sent."}catch(err){authErr(err)}break}
  case"logout":await signOut(auth);S.menu=false;toast("logged out");break;
  case"theme":themePick=d.t;try{localStorage.setItem("ga_theme",themePick)}catch{}render(true);break;
  case"type":S.type=d.t;render(true);break;
  case"ctype":S.ctype=d.t;render(true);break;
  case"sort":S.sort=d.t;render(true);break;
  case"clearq":S.q="";render(true);break;
  case"random":S.menu=false;if(S.items.length){location.hash="#/c/"+S.items[Math.floor(Math.random()*S.items.length)].id}else toast("nothing to show yet");break;
  case"like":{if(!need())break;const id=d.id,ref=doc(db,"likes",id+"_"+S.user.uid);
   if(S.myLikes.has(id)){await deleteDoc(ref);S.likes=S.likes.filter(l=>!(l.cid===id&&l.uid===S.user.uid))}
   else{await setDoc(ref,{cid:id,uid:S.user.uid});S.likes.push({cid:id,uid:S.user.uid})}
   rebuildLikes();render(true);break}
  case"save":{if(!need())break;const id=d.id,ref=doc(db,"saves",id+"_"+S.user.uid);
   if(S.saves.has(id)){await deleteDoc(ref);S.saves.delete(id)}else{await setDoc(ref,{cid:id,uid:S.user.uid});S.saves.add(id)}
   render(true);break}
  case"share":{const url=location.href.split("#")[0]+"#/c/"+d.id;
   try{await navigator.clipboard.writeText(url);toast("link copied")}catch{window.prompt("copy this link",url)}break}
  case"report":if(!need())break;
   await addDoc(collection(db,"reports"),{kind:d.kind,ref:d.ref,cid:d.cid,uid:S.user.uid,createdAt:serverTimestamp()});toast("thanks, we'll take a look");break;
  case"delcm":if(confirm("delete this comment?")){await deleteDoc(doc(db,"comments",d.id));loadComments(d.cid)}break;
  case"delmine":if(confirm("delete this contribution permanently?")){await deleteDoc(doc(db,"contributions",d.id));await loadPublic();loadMine()}break;
  case"approve":await updateDoc(doc(db,"contributions",d.id),{status:"approved"});await loadPublic();loadReview();break;
  case"reject":if(confirm("reject and delete this submission?")){await deleteDoc(doc(db,"contributions",d.id));loadReview()}break;
  case"dismiss":await deleteDoc(doc(db,"reports",d.id));loadReview();break;
  case"rm":if(confirm("remove this content?")){await deleteDoc(doc(db,d.kind==="comment"?"comments":"contributions",d.ref));await deleteDoc(doc(db,"reports",d.id));await loadPublic();loadReview()}break;
 }}catch(err){console.error(err);toast("that didn't work, please try again")}
});
function authErr(err){
 const m={"auth/invalid-credential":"wrong email or password.","auth/user-not-found":"no account with that email.","auth/wrong-password":"wrong email or password.","auth/email-already-in-use":"that email already has an account. try logging in.","auth/weak-password":"password must be at least 6 characters.","auth/invalid-email":"that email doesn't look right.","auth/popup-closed-by-user":"","auth/cancelled-popup-request":"","auth/too-many-requests":"too many attempts. wait a moment and try again.","auth/unauthorized-domain":"this site's domain isn't authorised in Firebase yet."};
 const el=$("#aerr");if(el)el.textContent=err&&err.code in m?m[err.code]:"something went wrong. please try again.";
}
document.addEventListener("input",e=>{
 const id=e.target.id;
 if(id==="tq"){S.q=e.target.value;if(parseHash().parts[0]==="explore"&&$("#results"))$("#results").innerHTML=resultsHTML(true)}
 if(id==="cq"){S.cq=e.target.value;$("#cl").innerHTML=clistHTML()}
});
document.addEventListener("change",e=>{if(e.target.id==="ftype")syncType()});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target;
 try{switch(f.id){
  case"topSearch":S.q=$("#tq").value.trim();if(location.hash==="#/explore")render(true);else location.hash="#/explore";break;
  case"af":{const em=$("#ae").value.trim(),pw=$("#ap").value;
   try{
    if(S.authMode==="signup"){S.pendingName=$("#an").value.trim().slice(0,40);await createUserWithEmailAndPassword(auth,em,pw)}
    else await signInWithEmailAndPassword(auth,em,pw);
    S.modal=null;render(true);
   }catch(err){authErr(err)}break}
  case"cmf":{const text=$("#ct").value.trim();if(!text)break;
   await addDoc(collection(db,"comments"),{cid:f.dataset.cid,uid:S.user.uid,name:myName().slice(0,60),text,createdAt:serverTimestamp()});
   $("#ct").value="";loadComments(f.dataset.cid);break}
  case"pf":{const p={name:$("#pn").value.trim().slice(0,40),bio:$("#pb").value.trim().slice(0,300),home:$("#ph2").value};
   if(!p.name)break;await setDoc(doc(db,"users",S.user.uid),p);S.profile=p;toast("profile saved");render(true);break}
  case"cf":{const type=$("#ftype").value,link=$("#fl").value.trim(),err=$("#ferr");err.textContent="";
   if(link&&!safeUrl(link)){err.textContent="that link needs to start with http:// or https://";break}
   const data={country:$("#fc").value,type,title:$("#ft").value.trim(),body:$("#fb").value.trim(),authorUid:S.user.uid,authorName:myName().slice(0,60),status:"pending",createdAt:serverTimestamp()};
   const artist=$("#fa").value.trim();if(type==="song"&&artist)data.artist=artist;if(link)data.link=link;
   try{await addDoc(collection(db,"contributions"),data)}catch(x){console.error(x);err.textContent="couldn't submit. check everything is filled in and try again.";break}
   $("main").innerHTML=`<div class="notice">thank you! your contribution was submitted and will appear once it's been reviewed.</div><div class="row"><a class="btn" href="#/contribute">add another</a><a class="btn" href="#/mine">my contributions</a></div>`;break}
 }}catch(err){console.error(err);toast("that didn't work, please try again")}
});
window.addEventListener("hashchange",()=>{S.menu=false;render(false)});
onAuthStateChanged(auth,async u=>{
 S.user=u;S.profile=null;S.admin=false;S.saves=new Set();
 if(u){await Promise.all([ensureProfile(u),checkAdmin(u).then(v=>{S.admin=v}),loadSaves(u)])}
 rebuildLikes();S.authReady=true;render(true);
});
render(false);
loadPublic().then(()=>render(true));
</script>
</body>
</html>
