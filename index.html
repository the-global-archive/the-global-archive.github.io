<style>

.acts{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.tl{margin-top:22px;max-width:760px}
.tlm{margin:24px 0 10px;font:italic 400 1.5rem 'Instrument Serif',Georgia,serif;color:var(--muted)}

.tld{font:400 1.5rem/1.2 'Instrument Serif',Georgia,serif;min-width:1.7em;padding-top:4px}
.tlb{flex:1;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;color:var(--cink);transition:transform .2s}.tli:hover .tlb{transform:translateX(3px)}
.tlb .k{color:var(--cink);opacity:.8}.tlb .cq{font-size:1.15rem}
.scrim{position:fixed;inset:0;background:rgba(40,20,30,.3);z-index:7}
.drawer{position:fixed;top:0;right:0;bottom:0;height:100dvh;width:min(320px,90vw);background:var(--card);z-index:8;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:auto;border-radius:28px 0 0 28px;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.dhead{padding:6px 8px 12px}.dsec{font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:16px 10px 4px}
.dl{display:block;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:500}.dl:hover{background:var(--soft)}
.dout{margin-top:auto;width:100%;text-align:center}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px 10px}
.swb{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);padding:0}.swb.on{box-shadow:0 0 0 2.5px var(--ink)}
.modal{position:fixed;inset:0;background:rgba(40,20,30,.4);display:grid;place-items:start center;padding:16px;overflow:auto;z-index:9}
.sheet{background:var(--card);border-radius:28px;padding:26px;width:100%;max-width:400px;margin:6vh 0}
.div{text-align:center;margin:16px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:.88rem;z-index:20}
.urow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}.urow:first-child{border-top:0}
@media(max-width:640px){.logo span{display:none}.hide-m{display:none}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),db=getFirestore(fbApp);
const S={user:null,profile:null,admin:false,banned:false,authReady:false,items:[],likes:[],likeMap:{},myLikes:new Set(),saves:new Set(),following:new Set(),

 try{

 try{

 }catch(e){console.error(e);S.profile={name:u.displayName||"anonymous",bio:"",home:""}}
}

async function loadMyStuff(u){
 try{
  const[s,f]=await Promise.all([getDocs(query(collection(db,"saves"),where("uid","==",u.uid))),getDocs(query(collection(db,"follows"),where("follower","==",u.uid),limit(1000)))]);
  S.saves=new Set(s.docs.map(d=>d.data().cid));S.following=new Set(f.docs.map(d=>d.data().following));
 }catch(e){console.error(e)}
}
const myName=()=>(S.profile&&S.profile.name)||(S.user&&S.user.displayName)||"anonymous";
function need(){
 if(!S.user){S.modal="auth";S.authMode="login";render(true);return false}
 if(S.banned){toast("this account has been suspended");return false}
 return true;
}

/* ---------- pieces ---------- */
const hay=c=>[c.caption,c.country,c.authorName,TYPES[c.type]].join(" ").toLowerCase();
function cover(c,full){
 if(full)return `<div class="cover gr" style="${hs(c.country)}"><span class="cg">${GLY[c.type]||"✨"}</span><span class="cq big">${esc(c.country)}</span></div>`;
 const ht=[150,190,230,270][hh(c.id)%4];
 return `<div class="cover gr" style="${hs(c.country)};min-height:${ht}px"><span class="cg">${GLY[c.type]||"✨"}</span><span class="cq">${esc(clip(c.caption,125))}</span></div>`;
}
function card(c){
 return `<a class="pin" href="#/c/${esc(c.id)}"><div class="pc">${cover(c,false)}<span class="ptag">${esc(c.country)}</span><span class="plk">♥ ${S.likeMap[c.id]||0}</span></div>
 <div class="pm"><span class="av gr" style="${hs(c.authorName)}">${esc(ini(c.authorName))}</span><span>${esc(c.authorName||"anonymous")}</span><span class="sp">${esc(TYPES[c.type]||c.type)}</span></div></a>`;
}
const grid=(L,msg)=>L.length?`<div class="mas">${L.map(card).join("")}</div>`:`<p class="empty">${msg||"nothing here yet."}</p>`;
function chipsFor(active,act){
 return `<button class="btn s ${active===""?"on":""}" data-act="${act}" data-t="">all</button>`+Object.entries(TYPES).map(([k,v])=>`<button class="btn s ${active===k?"on":""}" data-act="${act}" data-t="${k}">${GLY[k]} ${v}</button>`).join("");
}
function embed(url){
 let m=url.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,15})/);
 if(m)return `<iframe class="emb" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy" title="video"></iframe>`;
 m=url.match(/open\.spotify\.com\/(track|album|playlist|episode)\/(\w{10,30})/);
 if(m)return `<iframe class="emb spo" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" allow="encrypted-media" loading="lazy" title="spotify"></iframe>`;
 return "";
}
const loginPrompt=w=>`<div class="box"><p>log in to see ${w}.</p><button class="btn p" data-act="login">log in or sign up</button></div>`;
const tiles=arr=>`<div class="tiles">${arr.map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("")}</div>`;
const banBanner=()=>S.banned?`<div class="notice">this account has been suspended. you can still browse, but you can't post, like, comment or follow.</div>`:"";

/* ---------- views ---------- */
function top(){
 const burger=`<button class="burger" data-act="menu" aria-label="menu"><svg class="ico" viewBox="0 0 24 24" style="color:var(--ink)"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>`;
 return `<header class="top"><a class="logo" href="#/">${globe(36)}<span>the global archive</span></a>
 <form id="topSearch" class="srch"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" placeholder="search recipes, songs, countries…" aria-label="search" value="${esc(S.q)}" autocomplete="off"></form>
 ${!S.authReady?"":S.user?`<button class="avb av gr" style="${hs(myName())}" data-act="menu" aria-label="menu">${esc(ini(myName()))}</button>`:`<button class="btn" data-act="login">log in</button>${burger}`}</header>`;
}
function highlights(){
 const c=S.spot&&S.items.find(x=>x.id===S.spot.cid);
 const spot=c?`<a class="spot gr" style="${hs(c.country)}" href="#/c/${esc(c.id)}"><span class="lbl">✦ contribution of the week</span><span class="cq">${esc(clip(c.caption,230))}</span>
  <span class="row k" style="color:inherit"><span>${GLY[c.type]||""} ${esc(c.country)}</span><span class="sp">by ${esc(c.authorName||"anonymous")}</span></span></a>`
  :S.admin?`<div class="nudge"><span class="lbl">✦ contribution of the week</span><p>nothing is spotlighted this week yet.</p><a class="btn s p" href="#/admin" data-tab="spot">choose one</a></div>`:"";
 const f=S.fact;
 const fact=f?`<div class="fact"><span class="lbl">☁ fun fact of the day</span><p>${esc(f.text)}</p>${f.country&&COUNTRIES.includes(f.country)?`<a class="k" href="#/country/${enc(f.country)}">more from ${esc(f.country)} →</a>`:""}</div>`
  :S.admin?`<div class="nudge"><span class="lbl">☁ fun fact of the day</span><p>no fun fact set for today.</p><a class="btn s p" href="#/admin" data-tab="facts">add one</a></div>`:"";
 if(!spot&&!fact)return "";
 return `<div class="hl ${spot&&fact?"":"one"}">${spot}${fact}</div>`;
}
function resultsHTML(useQ){
 let L=S.items.filter(c=>!useQ||!S.q||hay(c).includes(S.q.toLowerCase()));
 const fol=S.sort==="following"&&S.user;
 if(fol)L=L.filter(c=>S.following.has(c.authorUid));
 if(S.sort==="liked")L=[...L].sort((a,b)=>(S.likeMap[b.id]||0)-(S.likeMap[a.id]||0));
 return grid(L,fol?"follow people and their posts will show up here.":S.items.length?"nothing matches.":"no posts yet. be the first to share a piece of home.");
}
function feed(useQ){
 const cs=new Set(S.items.map(c=>c.country)),au=new Set(S.items.map(c=>c.authorUid));
 const head=useQ&&S.q?`<div class="row" style="margin-top:14px"><h2>results for “${esc(S.q)}”</h2><button class="btn s" data-act="clearq">clear</button></div>`
  :`<section class="intro"><h1>the world, <em>one contribution at a time</em></h1>
  <p class="sub">recipes, songs, writing and notes about the places we come from, shared by the people who know them.</p>
  <div class="row" style="margin-top:16px"><a class="btn p" href="#/contribute">share a piece of home</a><button class="btn" data-act="random">surprise me</button><a class="btn" href="#/countries">browse countries</a></div>
  <p class="k" style="margin-top:14px">${S.items.length} posts · ${cs.size} of ${COUNTRIES.length} countries · ${au.size} contributors</p></section>${highlights()}`;
 const sorts=[["new","latest"],["liked","most loved"]];if(S.user)sorts.push(["following","following"]);
 return `${banBanner()}${head}<div class="chips">${sorts.map(([k,v])=>`<button class="btn s ${S.sort===k?"on":""}" data-act="sort" data-t="${k}">${v}</button>`).join("")}</div>
 <div id="results">${resultsHTML(useQ)}</div>`;
}
function clistHTML(){
 const m={};for(const c of S.items)m[c.country]=(m[c.country]||0)+1;const f=S.cq.toLowerCase();
 const rows=COUNTRIES.filter(c=>c.toLowerCase().includes(f)).map(c=>({c,n:m[c]||0})).sort((a,b)=>b.n-a.n||a.c.localeCompare(b.c));
 return rows.length?rows.map(r=>`<a class="ctile gr ${r.n?"":"zero"}" style="${hs(r.c)}" href="#/country/${enc(r.c)}"><span class="cn2">${esc(r.c)}</span><span class="k">${r.n?r.n+" post"+(r.n>1?"s":""):"be the first"}</span></a>`).join(""):`<p class="empty">no matching countries.</p>`;
}
function countries(){
 return `<div class="intro"><h1>every <em>country</em></h1><p class="sub">the ones with posts come first. pick one to see what people have shared.</p></div>
 <div class="srch" style="margin:16px 0 0;max-width:420px"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cq" placeholder="search countries…" value="${esc(S.cq)}" aria-label="search countries"></div>
 <div class="ctiles" id="cl">${clistHTML()}</div>`;
}
function country(name){
 if(!COUNTRIES.includes(name))return `<p class="empty">country not found.</p>`;
 const all=S.items.filter(c=>c.country===name),L=all.filter(c=>!S.ctype||c.type===S.ctype);
 const likes=all.reduce((n,c)=>n+(S.likeMap[c.id]||0),0);
 return `<section class="cban gr" style="${hs(name)}"><a class="k" href="#/countries">← countries</a><h1>${esc(name)}</h1>
 <div class="row"><span class="tag">${all.length} posts</span><span class="tag">${new Set(all.map(c=>c.authorUid)).size} contributors</span><span class="tag">♥ ${likes}</span>
 <a class="btn p sp" href="#/contribute?country=${enc(name)}">+ post about ${esc(name)}</a></div></section>
 <div class="chips">${chipsFor(S.ctype,"ctype")}</div>
 ${L.length?grid(L):`<p class="empty">${all.length?"nothing of that kind yet.":"nothing here yet. be the first to share something from "+esc(name)+"."}</p>`}`;
}
function detail(id){
 const c=S.items.find(x=>x.id===id);
 if(!c)return `<p class="empty">that post doesn't exist, or hasn't been approved yet.</p>`;
 const liked=S.myLikes.has(id),saved=S.saves.has(id),link=c.link&&safeUrl(c.link),mineP=S.user&&S.user.uid===c.authorUid,fl=S.following.has(c.authorUid);
 S.after=()=>loadComments(id);
 return `<a class="k" href="#/country/${enc(c.country)}">← ${esc(c.country)}</a>${banBanner()}
 <article class="pinbig"><div class="pl">${cover(c,true)}${link?embed(link):""}</div>
 <div class="pr"><div class="row"><a class="row" style="gap:10px;text-decoration:none" href="#/u/${esc(c.authorUid)}"><span class="av gr" style="${hs(c.authorName)};width:40px;height:40px;font-size:.9rem">${esc(ini(c.authorName))}</span><b>${esc(c.authorName||"anonymous")}</b></a>
  ${mineP?"":`<button class="btn s ${fl?"on":""}" data-act="follow" data-uid="${esc(c.authorUid)}">${fl?"following":"follow"}</button>`}
  ${mineP?"":`<button class="btn s sp" data-act="report" data-kind="contribution" data-ref="${esc(id)}" data-cid="${esc(id)}">report</button>`}</div>
 <div class="body">${esc(c.caption)}</div>
 ${link?`<p><a class="btn s" href="${esc(link)}" target="_blank" rel="noopener noreferrer">open link ↗</a></p>`:""}
 <div class="row k"><span class="tag">${GLY[c.type]||""} ${esc(TYPES[c.type]||c.type)}</span><a href="#/country/${enc(c.country)}">${esc(c.country)}</a><span>·</span><span>${esc(dt(c.createdAt))}</span></div>
 <div class="row acts"><button class="btn s ${liked?"on":""}" data-act="like" data-id="${esc(id)}">♥ ${S.likeMap[id]||0}</button>
 <button class="btn s ${saved?"on":""}" data-act="save" data-id="${esc(id)}">${saved?"saved":"save"}</button>
 <button class="btn s" data-act="share" data-id="${esc(id)}">share</button>
 ${mineP||S.admin?`<button class="btn s d sp" data-act="delpost" data-id="${esc(id)}">delete post</button>`:""}</div>
 <h2 style="margin-top:26px">comments</h2><div id="cmts" data-cid="${esc(id)}" style="margin-top:12px"><p class="k">loading…</p></div>
 ${S.user?`<form id="cmf" data-cid="${esc(id)}" style="margin-top:14px"><div class="f"><textarea id="ct" maxlength="500" required placeholder="add a comment…" aria-label="add a comment" style="min-height:70px"></textarea></div><button class="btn p">post</button></form>`:`<p class="k" style="margin-top:14px"><button class="btn s" data-act="login">log in</button> to comment</p>`}
 </div></article>`;
}
async function loadComments(id){
 try{
  const s=await getDocs(query(collection(db,"comments"),where("cid","==",id),limit(200)));
  const L=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  const el=$("#cmts");if(!el||el.dataset.cid!==id)return;
  el.innerHTML=L.length?L.map(m=>`<div class="cm"><span class="av gr" style="${hs(m.name)}">${esc(ini(m.name))}</span><div class="grow"><div class="k"><a href="#/u/${esc(m.uid)}"><b>${esc(m.name)}</b></a> · ${esc(dt(m.createdAt))}</div><div class="body">${esc(m.text)}</div></div>
  ${S.user&&(m.uid===S.user.uid||S.admin)?`<button class="btn s d" data-act="delcm" data-id="${esc(m.id)}" data-cid="${esc(id)}">delete</button>`:S.user?`<button class="btn s" data-act="report" data-kind="comment" data-ref="${esc(m.id)}" data-cid="${esc(id)}">report</button>`:""}</div>`).join(""):`<p class="k">no comments yet.</p>`;
 }catch(e){console.error(e);const el=$("#cmts");if(el)el.innerHTML=`<p class="err">couldn't load comments.</p>`}
}
function contribute(params){
 const h=`<div class="intro"><h1>share a piece of <em>home</em></h1><p class="sub">a recipe, a song, something you wrote, or a note about a country. every post goes to a country, and appears once it's been reviewed.</p></div>`;
 if(!S.user)return h+loginPrompt("post");
 if(S.banned)return h+banBanner();
 const pre=params.get("country")||"";
 S.after=syncType;
 return `${h}<form id="cf" class="box fm">
 <div class="f"><label for="fc">country</label><select id="fc" required><option value="">choose a country…</option>${COUNTRIES.map(c=>`<option ${c===pre?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div class="f"><label for="ftype">what kind of post?</label><select id="ftype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${GLY[k]} ${v}</option>`).join("")}</select></div>
 <div class="f"><label for="fb">caption</label><textarea id="fb" class="big" maxlength="5000" required></textarea><span class="k">up to 5000 characters, plain text.</span></div>
 <div class="f"><label for="fl">link (optional)</label><input id="fl" type="url" maxlength="500" placeholder="youtube or spotify links play right on the post"></div>
 <div class="err" id="ferr"></div><button class="btn p">submit for review</button></form>`;
}
function syncType(){
 const t=$("#ftype");if(!t)return;
 $("#fb").placeholder={recipe:"ingredients, method, and the story behind it…",song:"song title, artist, and why you love it…",writing:"your piece of writing…",note:"a note about this place…",other:"what do you want to share?"}[t.value]||"";
}
function saved(){
 if(!S.user)return loginPrompt("your saved posts");
 return `<div class="intro"><h1>saved</h1></div>${grid(S.items.filter(c=>S.saves.has(c.id)),"nothing saved yet.")}`;
}
function mine(){
 if(!S.user)return loginPrompt("your posts");
 S.after=loadMine;
 return `<div class="intro"><h1>my posts</h1></div><div id="ml"><p class="k" style="margin-top:12px">loading…</p></div>`;
}
async function loadMine(){
 try{
  const s=await getDocs(query(collection(db,"contributions"),where("authorUid","==",S.user.uid)));
  const L=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const el=$("#ml");if(!el)return;
  el.innerHTML=L.length?L.map(c=>`<div class="box"><div class="row"><span class="tag">${GLY[c.type]||""} ${esc(TYPES[c.type]||c.type)}</span><span class="pill ${c.status==="approved"?"ok":"pend"}">${esc(c.status)}</span><span class="k sp">${esc(c.country)}</span></div>
  <p style="margin:10px 0 0">${c.status==="approved"?`<a href="#/c/${esc(c.id)}">${esc(clip(c.caption,160))}</a>`:esc(clip(c.caption,160))}</p>
  <div class="row" style="margin-top:12px"><button class="btn s d" data-act="delmine" data-id="${esc(c.id)}">delete</button></div></div>`).join(""):`<p class="empty">you haven't posted anything yet.</p>`;
 }catch(e){console.error(e);const el=$("#ml");if(el)el.innerHTML=`<p class="err">couldn't load your posts.</p>`}
}
function timeline(L){
 if(!L.length)return `<p class="empty">nothing posted yet.</p>`;
 let out="",last="";
 for(const c of L){
  const d=tdate(c.createdAt),m=d?d.toLocaleDateString(undefined,{month:"long",year:"numeric"}).toLowerCase():"earlier";
  if(m!==last){out+=`<div class="tlm">${esc(m)}</div>`;last=m}
  out+=`<a class="tli" href="#/c/${esc(c.id)}"><span class="tld">${d?d.getDate():""}</span><span class="tlb gr" style="${hs(c.country)}"><span class="k">${GLY[c.type]||""} ${esc(c.country)} · ♥ ${S.likeMap[c.id]||0}</span><span class="cq">${esc(clip(c.caption,170))}</span></span></a>`;
 }
 return `<div class="tl">${out}</div>`;
}
function drawHead(){
 const el=$("#ph"),P=S.pf;if(!el||!P||el.dataset.uid!==P.uid)return;
 const L=S.items.filter(c=>c.authorUid===P.uid),me=S.user&&S.user.uid===P.uid;
 const name=(P.p&&P.p.name)||(L[0]&&L[0].authorName)||"anonymous",fl=S.following.has(P.uid),hd=S.user&&P.hearts.has(S.user.uid);
 el.innerHTML=`<span class="av gr" style="${hs(name)}">${esc(ini(name))}</span><h1>${esc(name)}</h1>
 <div class="row" style="justify-content:center;margin-top:10px">${P.p&&P.p.home?`<a class="btn s" href="#/country/${enc(P.p.home)}">from ${esc(P.p.home)}</a>`:""}
 ${me?`<a class="btn s" href="#/settings">edit profile</a>`:`<button class="btn s p ${fl?"on":""}" data-act="follow" data-uid="${esc(P.uid)}">${fl?"following":"follow"}</button><button class="btn s ${hd?"on":""}" data-act="heart" data-uid="${esc(P.uid)}">${hd?"♥ hearted":"♡ heart"}</button>`}</div>
 ${P.p&&P.p.bio?`<p class="sub" style="margin:14px auto 0">${esc(P.p.bio)}</p>`:""}
 ${tiles([[L.length,"posts"],[new Set(L.map(c=>c.country)).size,"countries"],[P.followers.size,"followers"],[P.followingN,"following"],[P.hearts.size,"♥ hearts"]])}`;
}
function profile(uid){
 const L=S.items.filter(c=>c.authorUid===uid);
 S.after=async()=>{
  if(!S.pf||S.pf.uid!==uid){
   const pf={uid,p:null,followers:new Set(),followingN:0,hearts:new Set()};
   try{
    const[u,a,b,h]=await Promise.all([getDoc(doc(db,"users",uid)),getDocs(query(collection(db,"follows"),where("following","==",uid),limit(1000))),
     getDocs(query(collection(db,"follows"),where("follower","==",uid),limit(1000))),getDocs(query(collection(db,"hearts"),where("to","==",uid),limit(1000)))]);
    pf.p=u.exists()?u.data():null;pf.followers=new Set(a.docs.map(d=>d.data().follower));pf.followingN=b.docs.length;pf.hearts=new Set(h.docs.map(d=>d.data().from));
   }catch(e){console.error(e)}
   S.pf=pf;
  }
  drawHead();
 };
 return `<div class="phead"><div id="ph" data-uid="${esc(uid)}"><p class="k">loading…</p></div></div>${timeline(L)}`;
}
function settings(){
 if(!S.user)return loginPrompt("settings");
 const p=S.profile||{};
 return `<div class="intro"><h1>settings</h1></div><form id="pf" class="box fm"><h2 style="margin-bottom:14px">profile</h2>
 <div class="f"><label for="pn">display name</label><input id="pn" maxlength="40" required value="${esc(p.name||"")}"></div>
 <div class="f"><label for="pb">bio</label><textarea id="pb" maxlength="300">${esc(p.bio||"")}</textarea></div>
 <div class="f"><label for="ph2">home country</label><select id="ph2"><option value="">—</option>${COUNTRIES.map(c=>`<option ${p.home===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <button class="btn p">save profile</button><p class="k">your new name appears on things you post from now on. change colours from the menu.</p></form>`;
}

/* ---------- admin ---------- */
function admin(){
 if(!S.admin)return `<p class="empty">this page is for admins only.</p>`;
 const tabs=[["queue","review"],["spot","contribution of the week"],["facts","fun facts"],["users","people"]];
 S.after=loadAdmin;
 return `<div class="intro"><h1>admin</h1></div><div class="chips">${tabs.map(([k,v])=>`<button class="btn s ${S.atab===k?"on":""}" data-act="atab" data-t="${k}">${v}</button>`).join("")}</div><div id="adm"><p class="k">loading…</p></div>`;
}
function loadAdmin(){return({queue:loadQueue,spot:loadSpot,facts:loadFacts,users:loadUsers}[S.atab]||loadQueue)()}
async function loadQueue(){
 try{
  const[p,r]=await Promise.all([getDocs(query(collection(db,"contributions"),where("status","==","pending"),limit(100))),getDocs(query(collection(db,"reports"),limit(100)))]);
  const el=$("#adm");if(!el)return;
  const P=p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  const R=r.docs.map(d=>({id:d.id,...d.data()}));
  el.innerHTML=`<h2 style="margin-top:12px">waiting for approval (${P.length})</h2>`+(P.length?P.map(c=>{const l=c.link&&safeUrl(c.link);return `<div class="box"><div class="row"><span class="tag">${GLY[c.type]||""} ${esc(TYPES[c.type]||c.type)}</span><span class="k sp">${esc(c.country)} · ${esc(c.authorName)}</span></div>
  <div class="body">${esc(c.caption)}</div>${l?`<p class="k">${esc(l)}</p>`:""}
  <div class="row"><button class="btn s p" data-act="approve" data-id="${esc(c.id)}">approve</button><button class="btn s d" data-act="reject" data-id="${esc(c.id)}">reject &amp; delete</button></div></div>`}).join(""):`<p class="empty">nothing waiting.</p>`)
  +`<h2 style="margin-top:26px">reports (${R.length})</h2>`+(R.length?R.map(x=>`<div class="box"><div class="row"><span class="pill">${esc(x.kind)}</span><a class="k" href="#/c/${esc(x.cid)}">view post →</a></div>
  <div class="row" style="margin-top:12px"><button class="btn s" data-act="dismiss" data-id="${esc(x.id)}">dismiss</button><button class="btn s d" data-act="rm" data-id="${esc(x.id)}" data-kind="${esc(x.kind)}" data-ref="${esc(x.ref)}">remove content</button></div></div>`).join(""):`<p class="empty">no reports.</p>`);
 }catch(e){console.error(e);const el=$("#adm");if(el)el.innerHTML=`<p class="err">couldn't load the queue.</p>`}
}
async function loadSpot(){
 try{
  const s=await getDocs(query(collection(db,"spotlight"),limit(200)));
  const m={};s.docs.forEach(d=>{m[d.id]=d.data().cid});
  const el=$("#adm");if(!el)return;
  const opts=S.items.slice(0,400);
  const w0=mondayOf(new Date());
  el.innerHTML=`<p class="sub">choose the post spotlighted on the home page each week. weeks start on monday, and you can plan ahead.</p>`+
  [...Array(10).keys()].map(i=>{const d=addDays(w0,i*7),k=dkey(d),cur=m[k];
   return `<div class="box"><div class="row"><b>week of ${esc(fmtD(d))}</b>${i===0?`<span class="pill ok">this week</span>`:""}${cur?"":`<span class="k sp">not set</span>`}</div>
   <div class="row" style="margin-top:10px;flex-wrap:nowrap"><select data-wk="${k}" aria-label="post for the week of ${k}"><option value="">— choose a post —</option>${opts.map(c=>`<option value="${esc(c.id)}" ${c.id===cur?"selected":""}>${esc(c.country)} · ${esc(clip(c.caption,50))} (${esc(c.authorName)})</option>`).join("")}</select>
   <button class="btn s p" data-act="savespot" data-k="${k}">save</button>${cur?`<button class="btn s d" data-act="clearspot" data-k="${k}">clear</button>`:""}</div></div>`}).join("");
 }catch(e){console.error(e);const el=$("#adm");if(el)el.innerHTML=`<p class="err">couldn't load the planner.</p>`}
}
async function loadFacts(){
 try{
  const s=await getDocs(query(collection(db,"facts"),limit(400)));
  const m={};s.docs.forEach(d=>{m[d.id]=d.data()});
  const el=$("#adm");if(!el)return;
  const t0=new Date();
  el.innerHTML=`<p class="sub">write a fun fact for each day. today's fact shows on the home page. you can plan the next two weeks.</p>`+
  [...Array(14).keys()].map(i=>{const d=addDays(t0,i),k=dkey(d),cur=m[k];
   return `<div class="box"><div class="row"><b>${esc(fmtD(d))}</b>${i===0?`<span class="pill ok">today</span>`:""}${cur?"":`<span class="k sp">not set</span>`}</div>
   <div class="f" style="margin-top:10px"><textarea data-fk="${k}" maxlength="300" style="min-height:70px" placeholder="a fun fact…" aria-label="fun fact for ${k}">${esc(cur?cur.text:"")}</textarea></div>
   <div class="row"><select data-fc="${k}" style="max-width:240px" aria-label="country for ${k}"><option value="">no country</option>${COUNTRIES.map(c=>`<option ${cur&&cur.country===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
   <button class="btn s p" data-act="savefact" data-k="${k}">save</button>${cur?`<button class="btn s d" data-act="clearfact" data-k="${k}">clear</button>`:""}</div></div>`}).join("");
 }catch(e){console.error(e);const el=$("#adm");if(el)el.innerHTML=`<p class="err">couldn't load the planner.</p>`}
}
function usersHTML(){
 const f=S.uq.toLowerCase(),L=S.userList.filter(u=>!f||String(u.name||"").toLowerCase().includes(f));
 return L.length?L.map(u=>{const b=S.banSet.has(u.id);return `<div class="urow"><span class="av gr" style="${hs(u.name)}">${esc(ini(u.name))}</span><a href="#/u/${esc(u.id)}"><b>${esc(u.name||"anonymous")}</b></a>${b?`<span class="pill bad">banned</span>`:""}
  ${u.id===ADMIN_UID?`<span class="k sp">you (admin)</span>`:`<span class="sp row"><button class="btn s ${b?"":"d"}" data-act="${b?"unban":"ban"}" data-uid="${esc(u.id)}" data-name="${esc(u.name||"")}">${b?"unban":"ban"}</button><button class="btn s d" data-act="wipe" data-uid="${esc(u.id)}">delete all their content</button></span>`}</div>`}).join(""):`<p class="empty">no one found.</p>`;
}
async function loadUsers(){
 try{
  const[u,b]=await Promise.all([getDocs(query(collection(db,"users"),limit(500))),getDocs(query(collection(db,"bans"),limit(500)))]);
  S.userList=u.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>String(x.name||"").localeCompare(String(y.name||"")));
  S.banSet=new Set(b.docs.map(d=>d.id));
  const el=$("#adm");if(!el)return;
  el.innerHTML=`<p class="sub">ban someone to stop them posting, liking, commenting and following. you can also wipe everything they've posted.</p>
  <div class="srch" style="margin:14px 0 0;max-width:360px"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="uq" placeholder="search people…" value="${esc(S.uq)}" aria-label="search people"></div>
  <div class="box" id="ul">${usersHTML()}</div>`;
 }catch(e){console.error(e);const el=$("#adm");if(el)el.innerHTML=`<p class="err">couldn't load people.</p>`}
}

/* ---------- chrome ---------- */
function drawer(){
 const a=(h,t)=>`<a class="dl" href="${h}" data-close>${t}</a>`;
 return `<div class="scrim" data-act="close"></div><aside class="drawer"><div class="dhead"><span class="logo">${globe(32)}<span>the global archive</span></span></div>
 <div class="dsec">browse</div>${a("#/","home")}${a("#/countries","countries")}<button class="dl" style="border:0;background:none;text-align:left;width:100%;font:inherit" data-act="random" data-close>surprise me</button>
 <div class="dsec">you</div>${a("#/contribute","new post")}${S.user?a("#/saved","saved")+a("#/mine","my posts")+a("#/u/"+esc(S.user.uid),"my profile")+a("#/settings","settings"):""}${S.admin?a("#/admin","admin"):""}
 <div class="dsec">colours</div><div class="sws">${Object.keys(THEMES).map(n=>`<button class="swb ${themePick===n?"on":""}" data-act="theme" data-t="${n}" title="${n}" aria-label="${n} theme" style="background:${THEMES[n][2]}"></button>`).join("")}</div>
 ${S.user?`<button class="btn dout" data-act="logout">log out</button>`:`<button class="btn p dout" data-act="login">log in / sign up</button>`}</aside>`;
}
function authModal(){
 const su=S.authMode==="signup";
 return `<div class="modal"><div class="sheet"><div class="row"><h2>${su?"create an account":"welcome back"}</h2><button class="btn s sp" data-act="closemodal" aria-label="close">✕</button></div>
 <button class="btn" style="width:100%;margin-top:18px;padding:12px" data-act="google">continue with google</button><div class="div k">or use email</div>
 <form id="af">${su?`<div class="f"><label for="an">display name</label><input id="an" maxlength="40" required autocomplete="nickname"></div>`:""}
 <div class="f"><label for="ae">email</label><input id="ae" type="email" required autocomplete="email"></div>
 <div class="f"><label for="ap">password</label><input id="ap" type="password" minlength="6" required autocomplete="${su?"new-password":"current-password"}"></div>
 <div class="err" id="aerr"></div><button class="btn p" style="width:100%;padding:12px">${su?"sign up":"log in"}</button></form>
 <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn s" data-act="amode">${su?"have an account? log in":"new here? sign up"}</button><button class="btn s" data-act="reset">forgot password?</button></div></div></div>`;
}
function parseHash(){const h=location.hash.slice(1)||"/";const i=h.indexOf("?");const p=i<0?h:h.slice(0,i);return{parts:p.split("/").filter(Boolean),params:new URLSearchParams(i<0?"":h.slice(i+1))}}
function route(){
 const{parts,params}=parseHash(),r=parts[0],arg=parts[1]?decodeURIComponent(parts[1]):"";
 switch(r){case"explore":return feed(true);case"countries":return countries();case"country":return country(arg);case"c":return detail(arg);
 case"u":return profile(arg);case"contribute":return contribute(params);case"saved":return saved();case"mine":return mine();
 case"admin":return admin();case"settings":return settings();default:S.q="";return feed(false)}
}
function render(keep){
 const y=window.scrollY;applyTheme();S.after=null;
 let body;
 if(!S.loaded)body=S.loadErr?`<div class="box"><p class="err">couldn't load the archive. check that the firebase config and firestore rules are set up.</p></div>`:`<p class="k" style="margin-top:20px">loading…</p>`;
 else body=route();
 $("#app").innerHTML=top()+`<main>${body}</main>`;
 $("#layer").innerHTML=(S.menu?drawer():"")+(S.modal==="auth"?authModal():"");
 window.scrollTo(0,keep?y:0);
 if(S.after)S.after();
}

/* ---------- events ---------- */
async function refreshHome(){await loadHome();render(true)}
document.addEventListener("click",async e=>{
 const t=e.target;
 if(t.classList&&t.classList.contains("modal")){S.modal=null;render(true);return}
 if(t.closest("[data-close]")){S.menu=false;render(true)}
 const tabLink=t.closest("[data-tab]");if(tabLink)S.atab=tabLink.dataset.tab;
 const b=t.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,d=b.dataset;
 try{switch(a){
  case"menu":S.menu=!S.menu;render(true);break;
  case"close":S.menu=false;render(true);break;
  case"closemodal":S.modal=null;render(true);break;
  case"login":S.menu=false;S.modal="auth";S.authMode="login";render(true);break;
  case"amode":S.authMode=S.authMode==="login"?"signup":"login";render(true);break;
  case"google":try{await signInWithPopup(auth,new GoogleAuthProvider());S.modal=null}catch(err){authErr(err)}break;
  case"reset":{const em=$("#ae")?$("#ae").value.trim():"";if(!em){$("#aerr").textContent="enter your email first.";break}
   try{await sendPasswordResetEmail(auth,em);$("#aerr").textContent="password reset email sent."}catch(err){authErr(err)}break}
  case"logout":await signOut(auth);S.menu=false;toast("logged out");break;
  case"theme":themePick=d.t;try{localStorage.setItem("ga_theme",themePick)}catch{}render(true);break;
  case"ctype":S.ctype=d.t;render(true);break;
  case"sort":S.sort=d.t;render(true);break;
  case"clearq":S.q="";render(true);break;
  case"random":S.menu=false;if(S.items.length){location.hash="#/c/"+S.items[Math.floor(Math.random()*S.items.length)].id}else toast("nothing to show yet");break;
  case"like":{if(!need())break;const id=d.id,ref=doc(db,"likes",id+"_"+S.user.uid);
   if(S.myLikes.has(id)){await deleteDoc(ref);S.likes=S.likes.filter(l=>!(l.cid===id&&l.uid===S.user.uid))}
   else{await setDoc(ref,{cid:id,uid:S.user.uid});S.likes.push({cid:id,uid:S.user.uid})}
   rebuildLikes();render(true);break}
  case"save":{if(!need())break;const id=d.id,ref=doc(db,"saves",id+"_"+S.user.uid);
   if(S.saves.has(id)){await deleteDoc(ref);S.saves.delete(id)}else{await setDoc(ref,{cid:id,uid:S.user.uid});S.saves.add(id)}
   render(true);break}
  case"follow":{if(!need())break;const u=d.uid;if(u===S.user.uid)break;const ref=doc(db,"follows",S.user.uid+"_"+u);
   if(S.following.has(u)){await deleteDoc(ref);S.following.delete(u);if(S.pf&&S.pf.uid===u)S.pf.followers.delete(S.user.uid)}
   else{await setDoc(ref,{follower:S.user.uid,following:u});S.following.add(u);if(S.pf&&S.pf.uid===u)S.pf.followers.add(S.user.uid)}
   render(true);break}
  case"heart":{if(!need())break;const u=d.uid;if(u===S.user.uid||!S.pf)break;const ref=doc(db,"hearts",S.user.uid+"_"+u);
   if(S.pf.hearts.has(S.user.uid)){await deleteDoc(ref);S.pf.hearts.delete(S.user.uid)}
   else{await setDoc(ref,{from:S.user.uid,to:u});S.pf.hearts.add(S.user.uid)}
   drawHead();break}
  case"share":{const url=location.href.split("#")[0]+"#/c/"+d.id;
   try{await navigator.clipboard.writeText(url);toast("link copied")}catch{window.prompt("copy this link",url)}break}
  case"report":if(!need())break;
   await addDoc(collection(db,"reports"),{kind:d.kind,ref:d.ref,cid:d.cid,uid:S.user.uid,createdAt:serverTimestamp()});toast("thanks, we'll take a look");break;
  case"delcm":if(confirm("delete this comment?")){await deleteDoc(doc(db,"comments",d.id));loadComments(d.cid)}break;
  case"delpost":if(confirm("delete this post permanently?")){await deleteDoc(doc(db,"contributions",d.id));await loadPublic();location.hash="#/";render(false)}break;
  case"delmine":if(confirm("delete this post permanently?")){await deleteDoc(doc(db,"contributions",d.id));await loadPublic();loadMine()}break;
  case"atab":S.atab=d.t;render(true);break;
  case"approve":await updateDoc(doc(db,"contributions",d.id),{status:"approved"});await loadPublic();loadQueue();break;
  case"reject":if(confirm("reject and delete this submission?")){await deleteDoc(doc(db,"contributions",d.id));loadQueue()}break;
  case"dismiss":await deleteDoc(doc(db,"reports",d.id));loadQueue();break;
  case"rm":if(confirm("remove this content?")){await deleteDoc(doc(db,d.kind==="comment"?"comments":"contributions",d.ref));await deleteDoc(doc(db,"reports",d.id));await loadPublic();loadQueue()}break;
  case"savespot":{const v=$('[data-wk="'+d.k+'"]').value;if(!v){toast("choose a post first");break}await setDoc(doc(db,"spotlight",d.k),{cid:v});toast("saved");await loadHome();loadSpot();break}
  case"clearspot":await deleteDoc(doc(db,"spotlight",d.k));toast("cleared");await loadHome();loadSpot();break;
  case"savefact":{const tx=$('[data-fk="'+d.k+'"]').value.trim();if(!tx){toast("write a fact first");break}
   const o={text:tx.slice(0,300)},c=$('[data-fc="'+d.k+'"]').value;if(c)o.country=c;await setDoc(doc(db,"facts",d.k),o);toast("saved");await loadHome();loadFacts();break}
  case"clearfact":await deleteDoc(doc(db,"facts",d.k));toast("cleared");await loadHome();loadFacts();break;
  case"ban":if(confirm("ban "+(d.name||"this person")+"?")){await setDoc(doc(db,"bans",d.uid),{name:d.name||"",at:serverTimestamp()});S.banSet.add(d.uid);$("#ul").innerHTML=usersHTML();toast("banned")}break;
  case"unban":await deleteDoc(doc(db,"bans",d.uid));S.banSet.delete(d.uid);$("#ul").innerHTML=usersHTML();toast("unbanned");break;
  case"wipe":if(confirm("delete ALL posts and comments by this person? this can't be undone.")){
   const[p,c]=await Promise.all([getDocs(query(collection(db,"contributions"),where("authorUid","==",d.uid),limit(500))),getDocs(query(collection(db,"comments"),where("uid","==",d.uid),limit(500)))]);
   await Promise.all([...p.docs.map(x=>deleteDoc(doc(db,"contributions",x.id))),...c.docs.map(x=>deleteDoc(doc(db,"comments",x.id)))]);
   await loadPublic();toast("deleted "+p.docs.length+" posts and "+c.docs.length+" comments")}break;
 }}catch(err){console.error(err);toast("that didn't work, please try again")}
});
function authErr(err){
 const m={"auth/invalid-credential":"wrong email or password.","auth/user-not-found":"no account with that email.","auth/wrong-password":"wrong email or password.","auth/email-already-in-use":"that email already has an account. try logging in.","auth/weak-password":"password must be at least 6 characters.","auth/invalid-email":"that email doesn't look right.","auth/popup-closed-by-user":"","auth/cancelled-popup-request":"","auth/too-many-requests":"too many attempts. wait a moment and try again.","auth/unauthorized-domain":"this site's domain isn't authorised in firebase yet."};
 const el=$("#aerr");if(el)el.textContent=err&&err.code in m?m[err.code]:"something went wrong. please try again.";
}
document.addEventListener("input",e=>{
 const id=e.target.id;
 if(id==="tq"){S.q=e.target.value;if(parseHash().parts[0]==="explore"&&$("#results"))$("#results").innerHTML=resultsHTML(true)}
 if(id==="cq"){S.cq=e.target.value;$("#cl").innerHTML=clistHTML()}
 if(id==="uq"){S.uq=e.target.value;$("#ul").innerHTML=usersHTML()}
});
document.addEventListener("change",e=>{if(e.target.id==="ftype")syncType()});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target;
 try{switch(f.id){
  case"topSearch":S.q=$("#tq").value.trim();if(location.hash==="#/explore")render(true);else location.hash="#/explore";break;
  case"af":{const em=$("#ae").value.trim(),pw=$("#ap").value;
   try{
    if(S.authMode==="signup"){S.pendingName=$("#an").value.trim().slice(0,40);await createUserWithEmailAndPassword(auth,em,pw)}
    else await signInWithEmailAndPassword(auth,em,pw);
    S.modal=null;render(true);
   }catch(err){authErr(err)}break}
  case"cmf":{if(!need())break;const text=$("#ct").value.trim();if(!text)break;
   await addDoc(collection(db,"comments"),{cid:f.dataset.cid,uid:S.user.uid,name:myName().slice(0,60),text,createdAt:serverTimestamp()});
   $("#ct").value="";loadComments(f.dataset.cid);break}
  case"pf":{if(!need())break;const p={name:$("#pn").value.trim().slice(0,40),bio:$("#pb").value.trim().slice(0,300),home:$("#ph2").value};
   if(!p.name)break;await setDoc(doc(db,"users",S.user.uid),p);S.profile=p;toast("profile saved");render(true);break}
  case"cf":{if(!need())break;const type=$("#ftype").value,link=$("#fl").value.trim(),err=$("#ferr");err.textContent="";
   if(link&&!safeUrl(link)){err.textContent="that link needs to start with http:// or https://";break}
   const data={country:$("#fc").value,type,caption:$("#fb").value.trim(),authorUid:S.user.uid,authorName:myName().slice(0,60),status:"pending",createdAt:serverTimestamp()};
   if(link)data.link=link;
   try{await addDoc(collection(db,"contributions"),data)}catch(x){console.error(x);err.textContent="couldn't submit. check everything is filled in and try again.";break}
   $("main").innerHTML=`<div class="notice">thank you! your post was submitted and will appear once it's been reviewed.</div><div class="row"><a class="btn" href="#/contribute">post another</a><a class="btn" href="#/mine">my posts</a></div>`;break}
 }}catch(err){console.error(err);toast("that didn't work, please try again")}
});
window.addEventListener("hashchange",()=>{S.menu=false;S.modal=null;S.pf=null;render(false)});
onAuthStateChanged(auth,async u=>{
 S.user=u;S.profile=null;S.admin=!!u&&u.uid===ADMIN_UID;S.banned=false;S.saves=new Set();S.following=new Set();S.pf=null;
 if(u){const[,bn]=await Promise.all([Promise.all([ensureProfile(u),loadMyStuff(u)]),loadBan(u)]);S.banned=bn}
 rebuildLikes();S.authReady=true;render(true);
});
render(false);
loadPublic().then(()=>render(true));
</script>
